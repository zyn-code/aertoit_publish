@if (links().length) {
  <ul class="social" [class.social--stacked]="layout() === 'stacked'">
    @for (link of links(); track link.key) {
      <li>
        <a class="social__link" [href]="link.href" rel="noopener noreferrer" target="_blank">
          <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path [attr.d]="link.path" />
          </svg>
          <span class="social__label">{{ link.label }}</span>
          <!-- The link opens a new tab; announcing that is a WCAG 3.2.5
               courtesy, and it also disambiguates four otherwise similar
               links for a screen-reader user tabbing the footer. -->
          <span class="visually-hidden">(nouvelle fenêtre)</span>
        </a>
      </li>
    }
  </ul>
}
